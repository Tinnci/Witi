name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: dart
          package-name: sims-like-game
          config-file: .release-please-config.json

  build-and-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            asset_name: sims-like-game-linux.tar.gz
            asset_content_type: application/gzip
          - os: windows-latest
            platform: windows
            asset_name: sims-like-game-windows.zip
            asset_content_type: application/zip
          - os: macos-latest
            platform: macos
            asset_name: sims-like-game-macos.tar.gz
            asset_content_type: application/gzip
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        channel: 'stable'
        
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: Build desktop
      run: flutter build ${{ matrix.platform }} --release
      
    - name: Create archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd build/${{ matrix.platform }}/x64/release/bundle
        tar -czf ../../../../../${{ matrix.asset_name }} *
        
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd build/windows/x64/runner/Release
        7z a ../../../../../${{ matrix.asset_name }} *
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ matrix.asset_name }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: ${{ matrix.asset_content_type }}
